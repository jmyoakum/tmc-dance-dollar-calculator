<title>Dance Dollar Calculator</title>

<style>
  :root {
    --bg: #000000;
    --card: #1a1d24;
    --card-2: #22262f;
    --line: #2e333d;
    --text: #ffffff;
    --muted: #9aa3b2;
    --accent: #f5b400;
    --accent-text: #0f1115;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 480px; margin: 0 auto; }

  header { text-align: center; padding: 0 0 20px; }
  header .logo {
    display: block; width: min(300px, 78vw); max-width: 100%; height: auto;
    margin: -64px auto -58px;   /* overlaps the image's own black padding only */
  }
  @media (min-width: 600px) { header .logo { width: 360px; margin: -80px auto -70px; } }
  header .t1 { font-size: 26px; font-weight: 800; letter-spacing: 0.12em; color: var(--accent); }
  header .t2 { font-size: 18px; font-weight: 500; color: var(--muted); margin-top: 2px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 6px; }
  .inputbox {
    display: flex; align-items: center;
    background: var(--card); border: 2px solid var(--line); border-radius: 14px;
    height: 64px; padding: 0 18px;
  }
  .inputbox:focus-within { border-color: var(--accent); }
  .inputbox .sym { font-size: 28px; font-weight: 600; color: var(--muted); }
  .inputbox input {
    flex: 1; min-width: 0; height: 100%; margin: 0 8px; padding: 0;
    background: transparent; border: 0; outline: none;
    color: var(--text); font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .inputbox input::placeholder { color: #4b5260; font-weight: 500; }
  .field.bad .inputbox { border-color: #e5484d; }
  .err { display: none; color: #ff8a8e; font-size: 13px; margin-top: 6px; }
  .field.bad .err { display: block; }

  .btn {
    display: block; width: 100%; height: 64px; border: 0; border-radius: 14px;
    font-size: 20px; font-weight: 800; letter-spacing: 0.1em; cursor: pointer;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); margin-top: 8px; }
  .btn-secondary { background: var(--card-2); color: var(--text); border: 2px solid var(--line); height: 56px; font-size: 16px; }
  .btn:active { filter: brightness(0.9); }
  .row { display: flex; gap: 12px; margin-top: 14px; }
  .row .btn { flex: 1; }

  .results { margin-top: 24px; }
  .card {
    background: var(--card-2); border: 1px solid var(--accent); border-radius: 16px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .card .title { font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: var(--accent); }
  .card .give { font-size: 38px; font-weight: 800; line-height: 1.15; margin: 8px 0 12px; font-variant-numeric: tabular-nums; }
  .card .give small { font-size: 19px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; }
  .card .charge-k { font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: var(--muted); margin-top: 8px; }
  .card .charge-v { font-size: 44px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kv { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding: 10px 0 2px; margin-top: 10px; }
  .kv .k { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted); }
  .kv .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .note { text-align: center; color: var(--muted); font-size: 14px; min-height: 18px; margin-top: 10px; }

  .ref { margin-top: 26px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .ref b { color: var(--text); font-weight: 700; }
</style>

    <div class="t1">DANCE DOLLAR</div>
    <div class="t2">Calculator</div>
  </header>

  <div class="field" id="f-dance">
    <label for="dance">DANCE AMOUNT</label>
    <div class="inputbox"><span class="sym">$</span>
      <input id="dance" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Dance amount in dollars">
    </div>
    <div class="err">Cannot be negative</div>
  </div>

  <button class="btn btn-primary" id="calc" type="button">CALCULATE</button>

  <div class="results" id="results">
    <div class="card">
      <div class="title">GIVE</div>
      <div class="give" id="e-give">0 <small>LARGE</small> + 0 <small>SMALL</small></div>
      <div class="charge-k">CUSTOMER CHARGE</div>
      <div class="charge-v" id="e-charge">$0</div>
      <div class="kv"><span class="k">PAYOUT</span><span class="v" id="e-pay">$0</span></div>
    </div>
  </div>

  <div class="row">
    <button class="btn btn-secondary" id="reset" type="button">RESET</button>
    <button class="btn btn-secondary" id="copy" type="button">COPY RESULTS</button>
  </div>
  <div class="note" id="note"></div>

  <div class="ref">
    <div><b>Small</b> &nbsp;$24 charge / $18 redeemable</div>
    <div><b>Large</b> &nbsp;$504 charge / $378 redeemable</div>
  </div>
</div>

<script id="dd-core">
/* ---- Pure business math (no DOM) ---- */
var DD = (function () {
  var SMALL_CHARGE = 24, SMALL_REDEEM = 18, SMALL_PER_LARGE = 21;

  // Small-equivalent units needed for a redeemable target given in whole cents.
  // Same as Math.ceil(targetRedeemable / 18), computed on integer cents so
  // floating-point noise can never round an exact target up by one unit.
  function unitsFor(targetCents) {
    if (!(targetCents > 0)) return 0;
    return Math.ceil(targetCents / (SMALL_REDEEM * 100));
  }

  function alloc(units) {
    return {
      units: units,
      large: Math.floor(units / SMALL_PER_LARGE),
      small: units % SMALL_PER_LARGE,
      charge: units * SMALL_CHARGE,
      redeemable: units * SMALL_REDEEM
    };
  }

  // amount: non-negative redeemable dollar target (may include cents).
  function calculate(amount) {
    return alloc(unitsFor(Math.round(amount * 100)));
  }

  return { calculate: calculate, unitsFor: unitsFor, alloc: alloc };
})();
if (typeof module !== "undefined") module.exports = DD;
</script>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var dance = $("dance"), note = $("note");
  var last = null;

  function money(n) { return "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 }); }

  // Returns { value, bad }. Blank -> 0. Strips $ , and spaces.
  function readNum(el) {
    var raw = String(el.value).replace(/[$,\s]/g, "");
    if (raw === "") return { value: 0, bad: false };
    var n = Number(raw);
    if (!isFinite(n)) return { value: 0, bad: false };
    if (n < 0) return { value: 0, bad: true };
    return { value: n, bad: false };
  }

  function run() {
    var d = readNum(dance);
    $("f-dance").classList.toggle("bad", d.bad);

    var r = DD.calculate(d.value);
    last = r;

    $("e-give").innerHTML = r.large + " <small>LARGE</small> + " + r.small + " <small>SMALL</small>";
    $("e-charge").textContent = money(r.charge);
    $("e-pay").textContent = money(r.redeemable);
    note.textContent = "";
  }

  function copyText() {
    if (!last) run();
    var r = last;
    return [
      "DANCE DOLLAR BREAKDOWN", "",
      r.large + " Large + " + r.small + " Small",
      "Redeemable: " + money(r.redeemable), "",
      "Customer Charge: " + money(r.charge)
    ].join("\n");
  }

  function copy() {
    run();
    var text = copyText();
    function done(ok) { note.textContent = ok ? "Copied" : "Copy failed"; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallback(text)); });
    } else {
      done(fallback(text));
    }
  }
  function fallback(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function reset() {
    dance.value = "";
    run();
    dance.focus();
  }

  dance.addEventListener("input", run);
  dance.addEventListener("keydown", function (e) { if (e.key === "Enter") { run(); dance.blur(); } });
  $("calc").addEventListener("click", function () { run(); document.activeElement && document.activeElement.blur(); });
  $("reset").addEventListener("click", reset);
  $("copy").addEventListener("click", copy);

  // exposed for automated checks
  window.ddCopyText = copyText;
  window.ddRun = run;
  run();
})();
</script>
